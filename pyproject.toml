[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-optimizer"
version = "0.1.0"
description = "Fantasy Premier League decision support: projections, a multi-week MILP transfer planner and a weekly report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "highspy>=1.8",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fpl-optimizer = "fpl_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpl_optimizer = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
